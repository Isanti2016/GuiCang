# =============================================================================
# GuiCang 部署编排（手册 2.2/2.3 物理视图）
# 拓扑：nginx(:80) → backend(:8080 内部) + redis + elasticsearch/kibana/filebeat
# 数据卷：guicang-data（SQLite/缩略图）、guicang-logs（日志）、guicang-config（本地配置）
# bind：/home/wb/nas（用户数据真源）、guicang-helper + sudoers（特权边界）
#
# 使用前：1) 复制 .env.example 为 .env 并填写 GUICANG_JWT_SECRET 等
#         2) 宿主先部署 guicang-helper（install-helper.sh）
#         3) docker compose up -d
# =============================================================================
name: guicang

services:
  nginx:
    image: nginx:alpine
    container_name: guicang-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/guicang.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks: [guicang-net]
    restart: unless-stopped

  backend:
    build: ../backend
    image: guicang-backend:latest
    container_name: guicang-backend
    env_file: .env
    environment:
      GUICANG_DATA_DIR: /data
      GUICANG_STORAGE_ROOT: /nas
      GUICANG_THUMBS_DIR: /data/thumbs
      GUICANG_AUTH_VERIFIER: helper
      GUICANG_HELPER_PATH: /usr/local/bin/guicang-helper
      SPRING_PROFILES_ACTIVE: sqlite
    volumes:
      - guicang-data:/data
      - guicang-logs:/var/log/guicang
      - guicang-config:/etc/guicang:ro
      - /home/wb/nas:/nas
      - /usr/local/bin/guicang-helper:/usr/local/bin/guicang-helper:ro
      - /etc/sudoers.d/guicang:/etc/sudoers.d/guicang:ro
    networks: [guicang-net]
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: guicang-redis
    command: ["redis-server", "--requirepass", "${GUICANG_REDIS_PASSWORD}"]
    volumes:
      - guicang-redis:/data
    networks: [guicang-net]
    restart: unless-stopped

  elasticsearch:
    image: elasticsearch:8.15.3
    container_name: guicang-es
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx1g
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - guicang-es:/usr/share/elasticsearch/data
    networks: [guicang-net]
    restart: unless-stopped

  kibana:
    image: kibana:8.15.3
    container_name: guicang-kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "127.0.0.1:5601:5601"
    depends_on:
      - elasticsearch
    networks: [guicang-net]
    restart: unless-stopped

  filebeat:
    image: elastic/filebeat:8.15.3
    container_name: guicang-filebeat
    volumes:
      - guicang-logs:/var/log/guicang:ro
      - ./filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
    depends_on:
      - elasticsearch
    networks: [guicang-net]
    restart: unless-stopped

volumes:
  guicang-data:
  guicang-logs:
  guicang-config:
  guicang-redis:
  guicang-es:

networks:
  guicang-net:
    name: guicang-net
