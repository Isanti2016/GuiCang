spring:
  application:
    name: guicang-backend
  profiles:
    default: sqlite
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
  flyway:
    locations: classpath:db/migration
    placeholders:
      # 主键类型默认按 SQLite；PostgreSQL profile 覆盖为 BIGSERIAL PRIMARY KEY
      db-id-type: INTEGER PRIMARY KEY AUTOINCREMENT

server:
  port: 8080

guicang:
  storage:
    root: /home/wb/nas
  jwt:
    # 生产必须用环境变量 GUICANG_JWT_SECRET 覆盖（≥32 字节）；以下仅为本地开发默认值
    secret: ${GUICANG_JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
    expire-hours: 2
  auth:
    # helper：经 sudo 白名单调宿主 guicang-helper（生产）；local：直连 PAM 脚本（仅本机开发）
    verifier: ${GUICANG_AUTH_VERIFIER:helper}
  helper:
    path: ${GUICANG_HELPER_PATH:/usr/local/bin/guicang-helper}
    pam-script: ${GUICANG_PAM_SCRIPT:../scripts/guicang-pam-verify.py}

logging:
  level:
    root: INFO
    com.guicang.nas: DEBUG
