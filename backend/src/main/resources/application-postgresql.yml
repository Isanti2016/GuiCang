# PostgreSQL 数据源（升级路径，需要时用 docker compose 起 postgres 并切换 profile）
# 敏感值走环境变量/本地配置，不写死进 git
spring:
  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/guicang
    username: ${GUICANG_POSTGRES_USER:guicang}
    password: ${GUICANG_POSTGRES_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  flyway:
    placeholders:
      db-id-type: BIGSERIAL PRIMARY KEY
