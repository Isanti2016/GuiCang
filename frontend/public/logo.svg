<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a2a52"/>
      <stop offset="100%" stop-color="#04101f"/>
    </linearGradient>
    <linearGradient id="tail" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#6ec8ff"/>
      <stop offset="100%" stop-color="#2b6fd4"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0%" stop-color="#6ec8ff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#6ec8ff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- 外圈金色细线 -->
  <circle cx="60" cy="60" r="56" fill="none" stroke="#d4af37" stroke-width="1.5" opacity="0.85"/>
  <circle cx="60" cy="60" r="51" fill="none" stroke="#6ec8ff" stroke-width="0.8" opacity="0.5"/>
  <!-- 底部光晕 -->
  <circle cx="60" cy="62" r="44" fill="url(#glow)"/>
  <!-- 背景 -->
  <circle cx="60" cy="60" r="50" fill="url(#bg)"/>
  <!-- 鲸鱼尾（归藏意象：深海收纳） -->
  <g transform="translate(60 66)">
    <path d="M -22 -4 C -22 -20 -10 -30 -4 -32 C -2 -24 0 -14 0 -6 L 0 -2 L -8 -8 C -14 -14 -18 -12 -14 -4 C -10 2 -6 2 -2 -1 Z"
          fill="url(#tail)"/>
    <path d="M 22 -4 C 22 -20 10 -30 4 -32 C 2 -24 0 -14 0 -6 L 0 -2 L 8 -8 C 14 -14 18 -12 14 -4 C 10 2 6 2 2 -1 Z"
          fill="url(#tail)"/>
    <!-- 尾柄 -->
    <rect x="-3" y="-8" width="6" height="18" rx="3" fill="#6ec8ff"/>
  </g>
  <!-- 金色水滴（归藏收藏之意） -->
  <circle cx="60" cy="34" r="5" fill="#d4af37" opacity="0.95"/>
  <circle cx="60" cy="34" r="2" fill="#0a2a52"/>
</svg>
